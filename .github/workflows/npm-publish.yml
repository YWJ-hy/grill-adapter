name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install Obsidian package dependencies
        working-directory: mcp/obsidian-wiki
        run: npm ci

      - name: Verify Obsidian package
        working-directory: mcp/obsidian-wiki
        run: npm run typecheck && npm test

      - name: Publish Obsidian package
        working-directory: mcp/obsidian-wiki
        run: npm publish --access public --provenance

      - name: Verify root package
        run: npm run pack:dry && npm run test:package

      - name: Publish root package
        run: npm publish --access public --provenance
